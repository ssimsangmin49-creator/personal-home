
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <style>
    :root {
      --paper: #faf9f5;
      --cream: #f3f0e8;
      --ink: #252b30;
      --muted: #686961;
      --line: #dedbd2;
      --accent: #496b60;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.8;
    }

    a { color: var(--accent); }

    .wrap {
      width: min(100% - 48px, 800px);
      margin-inline: auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      color: var(--ink);
    }

    .back {
      text-decoration: none;
      font-size: .95rem;
    }

    article { padding: 85px 0 100px; }

    .meta {
      font-family: Arial, sans-serif;
      font-size: .78rem;
      letter-spacing: .08em;
      color: var(--accent);
      text-transform: uppercase;
    }

   
h1 {
  font-size: clamp(1.9rem, 3.5vw, 2.7rem);
  font-weight: normal;
  line-height: 1.3;
  margin: 18px 0 24px;
}

    .content {
      margin-top: 55px;
      font-size: 1.12rem;
    }

    .content p { margin-bottom: 1.6em; }

    .content h2, .content h3 {
      font-weight: normal;
      line-height: 1.35;
      margin-top: 2em;
    }

    .content img {
      max-width: 100%;
      height: auto;
    }

    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 22px;
      margin-left: 0;
      color: var(--muted);
      font-style: italic;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 30px 0;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 700px) {
      .wrap { width: min(100% - 32px, 800px); }
      article { padding: 55px 0 70px; }
    }
  </style>
</head>

<body>
  <header>
    <nav class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        Sang Min Shim
      </a>
      <a class="back" href="{{ '/blog/' | relative_url }}">
        ← Thoughts & Notes
      </a>
    </nav>
  </header>

  <article class="wrap">
    <div class="meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% if page.categories.size > 0 %}
        · {{ page.categories | join: ", " }}
      {% endif %}
    </div>

    <h1>{{ page.title }}</h1>

    <div class="content">
      {{ content }}
    </div>
  </article>

  <footer>
    <div class="wrap">
      © {{ site.time | date: "%Y" }} Sang Min Shim
      · <a href="{{ '/blog/' | relative_url }}">Back to Journal</a>
    </div>
  </footer>
</body>
</html>
